[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "promptlite-seg"
version = "0.1.0"
description = "Training-free prompted segmentation and calibrated prompt-uncertainty experiments"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2.0",
  "Pillow>=10.0,<12.0",
  "matplotlib>=3.8,<4.0",
  "scikit-image==0.25.2",
  "scipy>=1.11,<2.0",
  "requests>=2.31,<3.0",
  "pyarrow>=14.0,<19.0",
  "pandas>=2.1,<3.0",
  "opencv-python-headless==5.0.0.93",
  "psutil>=5.9,<8.0",
  "pypdf>=5.0,<7.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
