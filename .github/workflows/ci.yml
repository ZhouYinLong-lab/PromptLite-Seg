name: CPU CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest

      # The pytest suite generates a synthetic image/mask/prompt fixture and
      # executes both the legacy visualization CLI and the data-free
      # confirmatory CPU CLI. CI therefore never downloads or redistributes VOC.
